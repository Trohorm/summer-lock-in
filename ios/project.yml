name: SummerLockIn
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  SummerLockIn:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources/index.html
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summerlockin.app
        MARKETING_VERSION: "3.5.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Lock In Pro: the gold icon people can switch to (UIApplication.setAlternateIconName("ProIcon"))
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: ProIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: SummerLockIn.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lock In
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSPhotoLibraryUsageDescription: Lets you add progress photos from your library.
        NSCameraUsageDescription: Lets you snap meals for nutrient estimates, take progress photos and scan friends' codes.
        CFBundleURLTypes:
          - CFBundleURLName: com.summerlockin.app
            CFBundleURLSchemes: [lockin]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
